services:
  postgres:
    image: postgres:16-alpine
    container_name: police_storage_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-police_storage_db}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
    driver: local
